services:

### PyTorch ##################################################
    pytorch-raw:
      restart: always
      image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-runtime
      stdin_open: true      # 相当于docker run -i
      tty: true             # 相当于docker run -t
      command: bash -c "tail -f /dev/null"  # 保持容器运行
      volumes:
        - ~/code/ml:/app
      working_dir: /app
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all  # 使用所有 GPU
                capabilities: [gpu]  # 必需，指定 GPU 能力
      networks:
        - frontend
        - backend

### PyTorch ##################################################
    pytorch:
      restart: always
      build:
        context: ./pytorch
      volumes:
        - ~/code/ml:/app
        - ${DATA_PATH_HOST}/vscode-server/pytorch:/root/.vscode-server
      ports:
       - "8888:8888"
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all  # 使用所有 GPU
                capabilities: [gpu]  # 必需，指定 GPU 能力
      networks:
        - frontend
        - backend

### workspace ##################################################
    workspace:
      extends:
        file: ./workspace/compose.yml
        service: workspace
      build:
        context: ./workspace
        args:
          - GITHUB_PROXY=${GITHUB_PROXY}
      <<: [*dns-config, *extra-hosts-config, *workspace-volumes-config]
      environment:
        # docker
        - DOCKER_HOST=
        - DOCKER_TLS_VERIFY=
        - DOCKER_TLS_CERTDIR=
        - DOCKER_CERT_PATH=
        # node ssl
        - NODE_OPTIONS=--openssl-legacy-provider
        # claude code
        - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
        - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
        - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
        - ANTHROPIC_DEFAULT_OPUS_MODEL=${ANTHROPIC_DEFAULT_OPUS_MODEL}
        - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANTHROPIC_DEFAULT_SONNET_MODEL}
        - ANTHROPIC_DEFAULT_HAIKU_MODEL=${ANTHROPIC_DEFAULT_HAIKU_MODEL}
        - CLAUDE_CODE_SUBAGENT_MODEL=${CLAUDE_CODE_SUBAGENT_MODEL}
        - CLAUDE_CODE_EFFORT_LEVEL=${CLAUDE_CODE_EFFORT_LEVEL}
        - ENABLE_LSP_TOOL=1
        - ENABLE_TOOL_SEARCH=true

### nginx ##################################################
    nginx:
      extends:
        file: ./nginx/compose.yml
        service: nginx
      build:
        context: ./nginx
      <<: [*dns-config, *extra-hosts-config, *volumes-config]

### fpm83 ##################################################
    fpm83:
      extends:
        file: ./php-fpm/compose.yml
        service: php-fpm
      build:
        context: ./php-fpm
        args:
          - LARADOCK_PHP_VERSION=8.3
      <<: [*dns-config, *extra-hosts-config, *volumes-config]

### fpm73 ##################################################
    fpm73:
      extends:
        file: ./php-fpm/compose.yml
        service: php-fpm
      build:
        context: ./php-fpm
        args:
          - LARADOCK_PHP_VERSION=7.3
      <<: [*dns-config, *extra-hosts-config, *volumes-config]

### v2rayA ##################################################
    # https://v2raya.org/docs/prologue/installation/docker/
    v2raya:
      image: mzz2017/v2raya
      restart: always
      # privileged: true
      # network_mode: host
      environment:
        - TZ=Asia/Shanghai
        - V2RAYA_LOG_FILE=/tmp/v2raya.log
        - V2RAYA_V2RAY_BIN=/usr/local/bin/v2ray
        # - V2RAYA_NFTABLES_SUPPORT=off
        # - IPTABLES_MODE=legacy
      # volumes:
        # - /lib/modules:/lib/modules:ro
        # - /etc/resolv.conf:/etc/resolv.conf
        # - /etc/v2raya:/etc/v2raya
      ports:
        - "2017:2017"
        - "20170-20172:20170-20172"
      networks:
        - frontend
        - backend
      <<: [*dns-config]

### redis-master-slave-sentinel ##################################################
  ### master ##################################################
    redis-master:
        image: 'bitnami/redis:latest'
        environment:
          - REDIS_REPLICATION_MODE=master
          - REDIS_PASSWORD=secret_redis
        ports:
          - '56379:6379'
        networks:
          - backend
  ### slave ##################################################
    redis-slave:
      image: 'bitnami/redis:latest'
      environment:
        - REDIS_REPLICATION_MODE=slave
        - REDIS_MASTER_HOST=redis-master
        - REDIS_MASTER_PASSWORD=secret_redis
        - REDIS_PASSWORD=secret_redis
      ports:
        - '56378:6379'
      depends_on:
        - redis-master
      networks:
        - backend
  ### slave ##################################################
    redis-sentinel:
      image: 'bitnami/redis-sentinel:latest'
      environment:
        - REDIS_MASTER_HOST=${DOCKER_HOST_IP}      # 哨兵监控的主节点服务名
        - REDIS_MASTER_PORT_NUMBER=56379
        - REDIS_MASTER_PASSWORD=secret_redis # 主节点密码
        - REDIS_SENTINEL_QUORUM=2             # 判定客观下线的仲裁数
        - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=5000
      # ports:
        # - '26379:26379'                       # 暴露哨兵端口
      depends_on:
        - redis-master
        - redis-slave
      networks:
        - backend
      # 如果需要部署多个哨兵，可以使用 --scale 参数
      # docker-compose up --scale redis-sentinel=3 -d

### headroom ################################################
    headroom:
      image: ghcr.io/chopratejas/headroom:latest
      restart: unless-stopped
      ports:
        - "8787:8787"
      environment:
        - TZ=${WORKSPACE_TIMEZONE}
        - ANTHROPIC_TARGET_API_URL=${ANTHROPIC_TARGET_API_URL}
        - HEADROOM_TELEMETRY=off
        - HEADROOM_PORT=8787
        - HEADROOM_HOST=0.0.0.0
      volumes:
        - headroom-data:/home/nonroot/.headroom
      networks:
        - backend

### dbx ################################################
    dbx:
      # image: t8y2/dbx:latest
      # 中国大陆用户可改用 CNB 镜像，以加快拉取速度：
      image: docker.cnb.cool/dbxio.com/dbx:latest
      pull_policy: always
      environment:
        - DBX_DISABLE_PASSWORD=1
      ports:
        - "4224:4224"
      volumes:
        - dbx-data:/app/data
      restart: unless-stopped
      networks:
        - backend

### mysql57 ################################################
    mysql57:
      restart: always
      build:
        context: ./mysql
        args:
          - MYSQL_VERSION=5.7
      environment:
        - MYSQL_DATABASE=${MYSQL_DATABASE}
        - MYSQL_USER=${MYSQL_USER}
        - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        - TZ=${WORKSPACE_TIMEZONE}
      volumes:
        - mysql57:/var/lib/mysql
        - ${MYSQL_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
      ports:
        - "30657:3306"
      networks:
        - backend

### mysql80 ################################################
    mysql80:
      restart: always
      build:
        context: ./mysql
        args:
          - MYSQL_VERSION=8.0
      environment:
        - MYSQL_DATABASE=${MYSQL_DATABASE}
        - MYSQL_USER=${MYSQL_USER}
        - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        - TZ=${WORKSPACE_TIMEZONE}
      volumes:
        - mysql80:/var/lib/mysql
        - ${MYSQL_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
      ports:
        - "30680:3306"
      networks:
        - backend

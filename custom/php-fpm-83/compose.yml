# PHP 8.3 变体：通过 extends 继承 php-fpm 的真实定义，
# 仅覆盖 LARADOCK_PHP_VERSION 并追加自定义 extra_hosts。
#
# 本文件由 docker-compose.custom.yml 通过 include + env_file 加载。
# env_file 提供 php-fpm/defaults.env，
# 使继承的 build args（BASE_IMAGE_TAG_PREFIX、INSTALL_* 等）正确解析。
# 若缺失，BASE_IMAGE_TAG_PREFIX 会解析为空，镜像名将变成 laradock/php-fpm:-8.3。

services:

  php-fpm-83:
    extends:
      file: php-fpm/compose.yml
      service: php-fpm
    build:
      context: ./php-fpm
      args:
        - LARADOCK_PHP_VERSION=8.3
        - GITHUB_PROXY=${GITHUB_PROXY}
    volumes:
      - ./php-fpm/php8.3.ini:/usr/local/etc/php/php.ini

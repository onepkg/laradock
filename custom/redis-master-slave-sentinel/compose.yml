services:

### master ##################################################
  redis-master:
      image: 'bitnami/redis:latest'
      environment:
        - REDIS_REPLICATION_MODE=master
        - REDIS_PASSWORD=secret_redis
      ports:
        - '56379:6379'
      networks:
        - backend
### slave ##################################################
  redis-slave:
    image: 'bitnami/redis:latest'
    environment:
      - REDIS_REPLICATION_MODE=slave
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PASSWORD=secret_redis
      - REDIS_PASSWORD=secret_redis
    ports:
      - '56378:6379'
    depends_on:
      - redis-master
    networks:
      - backend
### slave ##################################################
  redis-sentinel:
    image: 'bitnami/redis-sentinel:latest'
    environment:
      - REDIS_MASTER_HOST=redis-master      # 哨兵监控的主节点服务名（容器网络内）
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_MASTER_PASSWORD=secret_redis # 主节点密码
      - REDIS_SENTINEL_QUORUM=1             # 单哨兵仲裁数；--scale 3 时改回 2
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=5000
    # ports:
      # - '26379:26379'                       # 暴露哨兵端口
    depends_on:
      - redis-master
      - redis-slave
    networks:
      - backend
    # 如果需要部署多个哨兵，可以使用 --scale 参数
    # docker-compose up --scale redis-sentinel=3 -d

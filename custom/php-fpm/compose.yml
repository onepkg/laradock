# php-fpm 定制：通过 extends 继承上游 php-fpm 的真实定义。
#
# 本文件由 docker-compose.custom.yml 通过 include + env_file 加载。
# - env_file 提供 php-fpm/defaults.env 与 custom/php-fpm/defaults.env，
#   使继承的 build args（BASE_IMAGE_TAG_PREFIX、INSTALL_* 等）正确解析：
#   BASE_IMAGE_TAG_PREFIX 来自上游 defaults，PHP_FPM_INSTALL_* 覆盖项来自
#   custom/php-fpm/defaults.env（.env 中同名变量优先级更高）。
# - build.context 需显式写 ./php-fpm：extends 继承的相对路径会按上游
#   文件位置（php-fpm/）解析，写成 php-fpm/php-fpm；此处改回仓库根。
#
# 注意：php-fpm-73/83 变体【不】extends 本文件，而是各自 extends 上游并
# 共享本文件配套的 custom/php-fpm/defaults.env（extends 链中相对路径
# 解析基准不一致，避免多级链）。

services:

  php-fpm:
    extends:
      file: php-fpm/compose.yml
      service: php-fpm
    build:
      context: ./php-fpm
      args:
        - GITHUB_PROXY=${GITHUB_PROXY}
    volumes:
      # 代码卷显式重挂：extends 继承的相对路径按上游文件位置（php-fpm/）解析，
      # ${APP_CODE_PATH_HOST}=../ 会被错解析为仓库根目录；此处按项目目录解析为
      # 上级目录，compose 按容器目标路径去重后覆盖继承的错误挂载。
      - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}

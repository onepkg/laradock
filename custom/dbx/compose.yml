volumes:
  dbx-data:
    driver: ${VOLUMES_DRIVER}

services:
  dbx:
    # image: t8y2/dbx:latest
    # 中国大陆用户可改用 CNB 镜像，以加快拉取速度：
    image: docker.cnb.cool/dbxio.com/dbx:latest
    pull_policy: always
    environment:
      - DBX_DISABLE_PASSWORD=1
    ports:
      - "4224:4224"
    volumes:
      - dbx-data:/app/data
    restart: unless-stopped
    networks:
      - backend
